# Networked dependency bootstrap. This workflow never fabricates a lockfile and never bypasses security gates.
name: generate-lockfile
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout default branch
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve current stable Better Auth and verify security policy
        id: resolve
        run: node scripts/pin-better-auth.mjs

      - name: Re-check pinned Better Auth against the security floor and OSV
        id: gate
        run: node scripts/check-better-auth-advisory.mjs

      - name: Generate lockfile from the verified dependency catalog
        id: lockfile
        run: pnpm install --lockfile-only

      - name: Install dependencies using the generated lockfile
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        id: format
        run: pnpm format:check

      - name: TypeScript compile
        id: typecheck
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: ESLint
        id: lint
        run: pnpm lint 2>&1 | tee lint.log

      - name: Unit and architecture tests
        id: tests
        run: pnpm test

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostics
          path: |
            typecheck.log
            lint.log
          if-no-files-found: ignore

      - name: Commit lockfile and verified pin to the default branch
        id: commit
        if: success()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency bootstrap changes to commit."
            exit 0
          fi
          git commit -m "chore: pin verified Better Auth and add pnpm lockfile"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Explain bootstrap result in the run summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PNPM: ${{ steps.pnpm.outcome }}
          NODE: ${{ steps.node.outcome }}
          RESOLVE: ${{ steps.resolve.outcome }}
          GATE: ${{ steps.gate.outcome }}
          LOCKFILE: ${{ steps.lockfile.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          {
            echo "## Lockfile bootstrap diagnostics"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Checkout | $CHECKOUT |"
            echo "| pnpm setup | $PNPM |"
            echo "| Node setup | $NODE |"
            echo "| Resolve Better Auth from npm registry + OSV | $RESOLVE |"
            echo "| Security gate | $GATE |"
            echo "| Generate pnpm-lock.yaml | $LOCKFILE |"
            echo "| Frozen install | $INSTALL |"
            echo "| Formatting | $FORMAT |"
            echo "| TypeScript | $TYPECHECK |"
            echo "| ESLint | $LINT |"
            echo "| Tests | $TESTS |"
            echo "| Commit to default branch | $COMMIT |"
            echo
            echo "A warning about Node.js action runtime or Ubuntu image migration is not itself a failure."
            echo "If a security/version gate fails, the workflow intentionally does not create or commit a lockfile."
          } >> "$GITHUB_STEP_SUMMARY"
