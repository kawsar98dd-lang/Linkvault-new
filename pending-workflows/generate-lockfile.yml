# One-time networked bootstrap. Phase 2 was authored WITHOUT registry access, so three things could not be done:
#   1. resolve + verify the current stable Better Auth version (1.2.7 is below the 1.4.9 security floor)
#   2. generate pnpm-lock.yaml (never hand-written or faked)
#   3. run Prettier / the real TypeScript compiler
# This workflow does them on a networked GitHub runner and updates the default/main branch only after required checks pass. It fails closed:
# any unverifiable step stops the run; nothing is "skipped" or defaulted.
name: generate-lockfile
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve the CURRENT STABLE Better Auth version, verify it, pin it EXACTLY
        run: node scripts/pin-better-auth.mjs
      - name: Better Auth gate against the pinned version (policy floor + OSV; fails closed)
        run: node scripts/check-better-auth-advisory.mjs
      - name: Generate pnpm-lock.yaml from the pinned catalog (no hand-written lockfile)
        run: pnpm install --lockfile-only
      - name: Install from the generated lockfile (frozen)
        run: pnpm install --frozen-lockfile
      - name: Apply the repository Prettier configuration once
        run: pnpm format
      - name: Verify formatting after the automatic formatting pass
        run: pnpm format:check
      - name: TypeScript compile (blocking)
        run: pnpm typecheck 2>&1 | tee typecheck.log
      - name: ESLint (blocking)
        run: pnpm lint 2>&1 | tee lint.log
      - name: Unit and architecture tests (blocking)
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-reports
          path: |
            typecheck.log
            lint.log
          if-no-files-found: ignore
      - name: Commit and push to the default/main branch (normal push, never forced)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          # Include formatting changes to already tracked project files, plus the generated lockfile
          # and the verified dependency pin. Workflow files remain untouched (Prettier ignores them).
          git add -u
          git add pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency bootstrap changes to commit."
            exit 0
          fi
          git commit -m "chore: pin verified Better Auth and add pnpm lockfile"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          {
            echo "### Bootstrap complete"
            echo "- Better Auth pin and lockfile generated; required checks passed."
            echo "- Updated branch: $DEFAULT_BRANCH. No review branch or force-push is used."
          } >> "$GITHUB_STEP_SUMMARY"
