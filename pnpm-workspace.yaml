packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for third-party versions. All entries are EXACT pins.
# NOTE (Phase 2 offline authoring): these pins were chosen WITHOUT registry access.
# If `pnpm install` reports a non-existent version, move to the nearest published
# patch, then re-run `pnpm audit` (CI blocks on advisories). See
# docs/development/dependency-pinning.md.
catalog:
  typescript: 5.8.3
  zod: 3.24.2
  hono: 4.7.5
  "@hono/zod-openapi": 0.19.2
  drizzle-orm: 0.41.0
  pg: 8.14.1
  "@types/pg": 8.11.11
  # UNRESOLVED ON PURPOSE: 1.2.7 is below the security floor (1.4.9). The exact current stable version must be
  # resolved from the registry by the networked `generate-lockfile` workflow (scripts/pin-better-auth.mjs),
  # which verifies it exists, is above the floor and has no critical/high advisory. Until then installs fail closed.
  better-auth: 0.0.0-UNRESOLVED
  "@node-rs/argon2": 2.0.2
  next: 15.3.0
  react: 19.1.0
  react-dom: 19.1.0
  "@types/react": 19.1.0
  "@types/react-dom": 19.1.1
  "@types/node": 22.14.0
  server-only: 0.0.1
  vitest: 3.1.1
  "@vitest/coverage-v8": 3.1.1
  eslint: 9.24.0
  "@eslint/js": 9.24.0
  typescript-eslint: 8.29.0
  prettier: 3.5.3
  turbo: 2.5.0
  "@sentry/nextjs": 9.12.0
  "@sentry/node": 9.12.0
  # Satisfies the REQUIRED peer `webpack@>=4.40.0` of @sentry/webpack-plugin (a dependency of @sentry/nextjs).
  # Our .npmrc keeps auto-install-peers=false + strict-peer-dependencies=true, so every peer must be declared.
  # Declared only by apps/web (the sole consumer). Exact pin; existence NOT verified offline (CI/bootstrap will).
  webpack: 5.98.0
  "@opentelemetry/api": 1.9.0

onlyBuiltDependencies:
  - "@node-rs/argon2"
  - "@sentry/cli"
  - esbuild
  - sharp
